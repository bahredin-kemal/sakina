let S=Object.assign({lang:"am",theme:"auto",cl:28,pl:6,madh:"shafi",hij:0,qa:0,qc:[],cycles:[],logs:{},day:{},fa:{},pin:null,tab:"home",ni:null,loc:null,lb:"",fs:100},(()=>{try{return JSON.parse(localStorage.getItem(KEY)||localStorage.getItem("noor")||"{}")}catch(e){return{}}})());

async function hp(p,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);
 const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:150000,hash:"SHA-256"},k,256);
 return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

function ethiopic(d){
 const a=Math.floor((14-(d.getMonth()+1))/12),y=d.getFullYear()+4800-a,m=d.getMonth()+1+12*a-3;
 const j=d.getDate()+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;
 const r=(j-1723856)%1461,n=r%365+365*Math.floor(r/1460);
 return{y:4*Math.floor((j-1723856)/1461)+Math.floor(r/365)-Math.floor(r/1460),m:Math.floor(n/30),d:n%30+1}}
function hparts(d,month){const x=add(d,S.hij);
 return new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month,year:"numeric"}).formatToParts(x)}
const hv=(p,k)=>p.find(e=>e.type===k).value;
const hijri=d=>{const p=hparts(d,"long");return hv(p,"day")+" "+hv(p,"month")+" "+hv(p,"year").replace(/\s*AH/,"")};
const isRam=d=>{try{return+hv(hparts(d,"numeric"),"month")===9}catch(e){return false}};

function avg(){const st=S.cycles.map(c=>D(c.s)),g=[];
 for(let i=1;i<st.length;i++){const x=gap(st[i-1],st[i]);if(x>=15&&x<=60)g.push(x)}
 const r=g.slice(-6);return r.length?Math.round(r.reduce((a,b)=>a+b,0)/r.length):0}
function phase(day,cl,pl){const ov=cl-14;
 if(day<=pl)return"p"; if(day>=ov-5&&day<=ov+1)return"f"; if(day>ov+1)return"l"; return"c"}
function getStatus(){
 const td=today(),{min,max}=lim(),cl=avg()||+S.cl,last=S.cycles[S.cycles.length-1],open=!!(last&&!last.e),prev=S.cycles[S.cycles.length-2];
 let h=t("ibN"),d=t("ibNd"),cur="c",day=0;
 if(last){day=gap(D(last.s),td)+1;
  if(open){cur="p";
   if(day>max){h=t("ibX");d=t("ibXd")}else{h=t("ibP");d=t("ibPd")}
   if(prev&&prev.e&&gap(D(prev.e),D(last.s))<15)d+=" "+t("n15");
   if(isRam(td))d+=" "+t("ram");
  }else{const len=gap(D(last.s),D(last.e))+1;cur=phase(Math.min(day,cl),cl,len);
   if(day>cl){h=t("ibW");d=t("ibWd")}else if(day>cl-3){h=t("ibL");d=t("ibLd")}else{h=t("ibC");d=t("ibCd")}
   if(len<min&&day<=len+7)d+=" "+t("nMin")}}
 const ni=S.ni&&!S.ni.e;
 if(ni){h=t("ibP");d=t("ibPd")}
 return{td,cl,last,open,h,d,cur,day,exempt:open||ni}}

function ptimes(d,lat,lng){
 const rad=Math.PI/180,sn=a=>Math.sin(a*rad),cs=a=>Math.cos(a*rad);
 const n=(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12)-Date.UTC(2000,0,1,12))/864e5;
 const g=(357.529+.98560028*n)%360,q=(280.459+.98564736*n)%360,Lg=(q+1.915*sn(g)+.02*sn(2*g))%360,e=23.439-3.6e-7*n;
 let ra=Math.atan2(cs(e)*sn(Lg),cs(Lg))/rad/15;ra=(ra%24+24)%24;
 let eq=q/15-ra;if(eq>12)eq-=24;if(eq<-12)eq+=24;
 const dec=Math.asin(sn(e)*sn(Lg))/rad,noon=12-d.getTimezoneOffset()/60-lng/15-eq;
 const ang=a=>Math.acos((-sn(a)-sn(dec)*sn(lat))/(cs(dec)*cs(lat)))/rad/15;
 const f=S.madh==="hanafi"?2:1,A=-Math.atan(1/(f+Math.tan(Math.abs(lat-dec)*rad)))/rad;
 return[noon-ang(18),noon-ang(.833),noon,noon+ang(A),noon+ang(.833),noon+ang(17)]}
const hm=h=>{if(isNaN(h))return"–";const m=Math.round(((h%24)+24)%24*60)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const qibla=(lat,lng)=>{const r=Math.PI/180,dl=(39.8262-lng)*r;return(Math.atan2(Math.sin(dl),Math.cos(lat*r)*Math.tan(21.4225*r)-Math.sin(lat*r)*Math.cos(dl))/r+360)%360};

function ramDays(c){let n=0;if(!c.e)return 0;for(let d=D(c.s);d<=D(c.e);d=add(d,1))if(isRam(d)&&!S.fa[iso(d)])n++;return n}
function nextRam(td){for(let i=0;i<400;i++)if(isRam(add(td,i)))return i;return-1}
const chip=(a,v,on,n)=>`<button class="chip" aria-pressed="${on}" data-a="${a}" data-v="${v}">${n}</button>`;

function home(s){
 const{td,cl,last,open}=s,e=ethiopic(td),mon=ls("mon");
 let h=`<section><div class="dates">${[[t("eth"),`${mon[e.m]} ${e.d}, ${e.y}`],[t("hj"),hijri(td)],[t("gr"),td.toLocaleDateString(S.lang==="am"?"am-ET":"en-GB",{day:"numeric",month:"short",year:"numeric"})]].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join("")}</div></section>`;
 if(S.cycles.length&&(!S.lb||gap(D(S.lb),td)>30))h+=`<div class="ban">${t("bk")}</div>`;
 h+=`<section style="background:none;border:0;padding:0"><button class="main big" data-a="${open?"be":"bs"}">${open?t("bE"):t("bS")}</button></section>`;
 const pl=+S.pl,ov=cl-14,shown=Math.max(1,Math.min(s.day||1,cl)),R=95,C=2*Math.PI*R;
 const seg=[[0,pl,"var(--per)"],[pl,ov-6,"var(--post)"],[ov-6,ov+1,"var(--fer)"],[ov+1,cl,"var(--post)"]];
 let svg=`<circle cx="120" cy="120" r="${R}" fill="none" stroke="var(--line)" stroke-width="22"/>`;
 seg.forEach(([a,b,c])=>{if(b>a){const l=(b-a)/cl*C;svg+=`<circle cx="120" cy="120" r="${R}" fill="none" stroke="${c}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-a/cl*C}" transform="rotate(-90 120 120)"/>`}});
 if(last){const ang=((shown-.5)/cl)*2*Math.PI-Math.PI/2;svg+=`<circle cx="${120+R*Math.cos(ang)}" cy="${120+R*Math.sin(ang)}" r="9" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>`}
 h+=`<section><div class="wheel"><svg viewBox="0 0 240 240" role="img" aria-label="${t("ttl")}">${svg}</svg><div class="center"><b>${last?s.day:"–"}</b><span>${last?t("day")+" · "+t({p:"per",c:"post",f:"fer",l:"pre"}[s.cur]):""}</span></div></div>
 <div class="legend">${[["per","per"],["post","post"],["fer","fer"]].map(([c,k])=>`<span><i style="background:var(--${c})"></i>${t(k)}</span>`).join("")}</div></section>`;
 h+=`<section><h2>${t("ib")}</h2><div class="status" aria-live="polite">${s.h}<p>${s.d}</p></div></section>`;
 if(last){const sd=D(last.s);let nx=add(sd,cl),dn=gap(td,nx),fs=add(sd,ov-6),fe=add(sd,ov+1);
  if(fe<td){fs=add(nx,ov-6);fe=add(nx,ov+1)}
  const f=(d)=>d.toLocaleDateString(S.lang==="am"?"am-ET":"en-GB",{day:"numeric",month:"short"});
  const w=t("inD").split("|"),txt=(dn>=0?w[0]:w[1]).replace("{n}",Math.abs(dn));
  h+=`<section><h2>${t("next")}</h2><b>${f(nx)}</b> · ${txt}<div class="warn">${t("feW")}: ${f(fs)} – ${f(fe)}</div></section>`;
  if(!open&&S.gh!==last.s&&gap(D(last.e),td)<=3)h+=`<section><h2>${t("gh")}</h2><button class="main" data-a="gh">${t("ghY")}</button></section>`}
 const tl=ls("t"+s.cur),o=td.getDate();
 h+=`<section><h2>${t("tipT")}</h2><ul>${[tl[o%tl.length]].map(x=>`<li>${x}</li>`).join("")}</ul></section>`;
 return h}

function ibada(s){
 const td=today(),k=iso(td),r=dy(k),wd=td.getDay();let h="";
 h+=`<section><h2>${t("prT")}</h2>`+(s.exempt?`<div class="warn" style="margin:0">${t("prOff")}</div>`:`<div class="chips">${ls("pr").map((n,i)=>chip("pr",i,!!r.pr[i],n)).join("")}</div>`);
 const hd=+hv(hparts(td,"numeric"),"day");
 if(!s.exempt&&(wd===1||wd===4||(hd>=13&&hd<=15)))h+=`<div class="warn">${t("sf")}</div>`;
 let st=0;for(let i=0;i<365;i++){const d=add(td,-i),p=(S.day[iso(d)]||{}).pr||[];
  if(S.cycles.some(c=>D(c.s)<=d&&d<=(c.e?D(c.e):td)))continue;
  if(p.length===5&&p.every(Boolean))st++;else if(i>0)break}
 let wn=0,wdn=0;for(let i=0;i<7;i++){const d=add(td,-i);if(S.cycles.some(c=>D(c.s)<=d&&d<=(c.e?D(c.e):td)))continue;wdn++;wn+=((S.day[iso(d)]||{}).pr||[]).filter(Boolean).length}
 h+=`<div class="warn">${t("stk",{a:st,b:wdn?Math.round(wn/(wdn*5)*100):0})}</div></section>`;

 const dk=DH[(td.getDate()+td.getMonth())%DH.length];
 h+=`<section><h2>${t("dhT")}</h2><div dir="rtl" lang="ar" style="font-size:1.5rem;text-align:center">${dk[0]}</div><div class="warn" style="text-align:center">${dk[S.lang==="am"?1:2]}</div></section><section><h2>${t("tsT")}</h2><div class="qada"><button class="tasbih" data-a="tb">${r.ad}</button><button data-a="tbr">${t("rs")}</button></div></section>`;
 // prayer times + qibla
 h+=`<section><h2>${t("ptT")}</h2>`;
 if(!S.loc)h+=`<button class="main" data-a="loc">${t("loc")}</button>`;
 else{const ts=ptimes(td,S.loc.lat,S.loc.lng),n=new Date(),now=n.getHours()+n.getMinutes()/60,ix=[0,2,3,4,5].find(i=>ts[i]>now),nm=ls("ptn");
  h+=`<div class="pt">${ts.map((v,i)=>`<div class="${i===ix?"nx":""}"><small>${nm[i]}</small><br><b>${hm(v)}</b></div>`).join("")}</div>`;
  if(ix!==undefined)h+=`<div class="status" style="margin-top:10px">${t("nxt",{n:nm[ix],m:Math.round((ts[ix]-now)*60)})}</div>`;
  const b=qibla(S.loc.lat,S.loc.lng);
  h+=`<div class="qada" style="margin-top:10px"><div>${t("qb",{d:Math.round(b)})}</div><svg viewBox="-40 -40 80 80" width="70" aria-hidden="true"><circle r="36" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M0-32L8 6H-8Z" fill="var(--acc)" transform="rotate(${b})"/></svg></div><div class="warn">${t("ptW")}</div>`}
 h+=`</section>`;
 // fasting
 const ri=nextRam(td);
 h+=`<section><h2>${t("qT")}</h2><div class="qada"><div><span class="n">${S.qa}</span> ${t("left")}</div><div class="tools"><button data-a="qa">${t("add")}</button><button data-a="qd">${t("done")}</button></div></div>`;
 const pend=S.cycles.filter(c=>c.e&&!S.qc.includes(c.s)).reduce((a,c)=>a+ramDays(c),0);
 if(pend)h+=`<div style="margin-top:10px"><button data-a="qc" data-v="${pend}">${t("qc",{n:pend})}</button></div>`;
 if(ri===0&&!s.exempt){const f=S.fa[k];h+=`<h2 style="margin-top:14px">${t("ramNow")}</h2><div class="chips">${chip("fa","f",f==="f",t("faF"))}${chip("fa","m",f==="m",t("faM"))}</div>`}
 else if(ri>0)h+=`<div class="warn">${t("ramIn",{n:ri})}</div>`;
 h+=`</section>`;
 // occasions
 const ids=["1-1","1-10","9-1","10-1","12-9","12-10"],nm=ls("ocn"),found=[];
 for(let i=0;i<400&&found.length<4;i++){const p=hparts(add(td,i),"numeric"),id=+hv(p,"month")+"-"+ +hv(p,"day"),x=ids.indexOf(id);if(x>=0)found.push([nm[x],i])}
 h+=`<section><h2>${t("ocT")}</h2><ul>${found.map(([n,i])=>`<li>${n} · ${i?t("inD").split("|")[0].replace("{n}",i):t("tdy")}</li>`).join("")}</ul></section>`;
 return h}

function health(s){
 const td=today(),k=iso(td),r=dy(k),log=S.logs[k]||[];
 let h=`<section><h2>${t("sym")}</h2><div class="chips">${ls("syms").map((n,i)=>chip("sy",i,log.includes(i),n)).join("")}</div></section>`;
 if(s.open)h+=`<section><h2>${t("flT")}</h2><div class="chips">${ls("fl").map((n,i)=>chip("fl",i,r.fl===i,n)).join("")}</div></section>`;

 h+=`<section><h2>${t("waT")}</h2><div class="qada"><span class="n">${r.w}</span><div class="tools"><button data-a="w" data-v="-1" aria-label="-">−</button><button data-a="w" data-v="1" aria-label="+">+</button></div></div><h2 style="margin-top:14px">${t("moT")}</h2><div class="chips">${["😞","😕","😐","🙂","😊"].map((e,i)=>chip("md",i,r.m===i,e)).join("")}</div><div class="row" style="margin-top:10px"><label for="sl">${t("slT")}</label><input type="number" id="sl" data-f="sl" min="0" max="24" step="0.5" value="${r.sl}"></div></section>`;
 const ni=S.ni,mx=S.madh==="hanafi"?40:60;
 h+=`<section><h2>${t("nT")}</h2>`;
 if(!ni)h+=`<button data-a="ni0">${t("bS")}</button>`;
 else{const dd=gap(D(ni.s),ni.e?D(ni.e):td)+1;
  h+=`<div class="status">${ni.e?t("nDn",{d:dd}):dd>mx?t("nOv"):t("nOn",{d:dd,m:mx})}</div><div class="row" style="margin-top:8px">${ni.e?"":`<button class="main" data-a="ni1">${t("bE")}</button>`}<button data-a="nid">${t("nDel")}</button></div>`}
 h+=`</section>`;
 const st=S.cycles.map(c=>D(c.s)),g=[];for(let i=1;i<st.length;i++)g.push(gap(st[i-1],st[i]));
 if(g.length>=3){const a=g.reduce((p,q)=>p+q,0)/g.length,sd=Math.sqrt(g.reduce((p,q)=>p+(q-a)**2,0)/g.length);
  h+=`<section><h2>${t("rg")}</h2>${ls("rgs")[sd<=2?0:sd<=4?1:2]} (±${sd.toFixed(1)})${a<21||a>35?`<div class="warn">${t("rgD")}</div>`:""}</section>`}
 return h}

function calendar(s){
 const td=s.td,f=new Date(td.getFullYear(),td.getMonth()+cm,1),nd=new Date(f.getFullYear(),f.getMonth()+1,0).getDate(),lc=S.lang==="am"?"am-ET":"en-GB";
 const last=s.last,cl=s.cl,ov=cl-14,pl=+S.pl;let nx=null,fs=null,fe=null;
 if(last){const sd=D(last.s);nx=add(sd,cl);fs=add(sd,ov-6);fe=add(sd,ov+1);if(fe<td){fs=add(nx,ov-6);fe=add(nx,ov+1)}}
 let g=Array.from({length:7},(_,i)=>`<div><b>${new Date(2024,0,7+i).toLocaleDateString(lc,{weekday:"narrow"})}</b></div>`).join("")+"<div></div>".repeat(f.getDay());
 for(let i=1;i<=nd;i++){const d=new Date(f.getFullYear(),f.getMonth(),i);let c="";
  if(S.cycles.some(y=>D(y.s)<=d&&d<=(y.e?D(y.e):td)))c="cp";else if(nx&&d>=nx&&d<add(nx,pl))c="cq";else if(fs&&d>=fs&&d<=fe)c="cf";
  if(+d===+td)c+=" t";g+=`<div class="${c}">${i}</div>`}
 let h=`<section><h2>${t("calT")}: ${f.toLocaleDateString(lc,{month:"long",year:"numeric"})}</h2><div class="cal">${g}</div><div class="row" style="margin-top:8px;justify-content:center"><button data-a="cm" data-v="-1" aria-label="‹">‹</button><button data-a="cm" data-v="1" aria-label="›">›</button></div></section>`;
 const a=avg();
 h+=`<section><h2>${t("hT")}</h2>${a?`<div class="warn" style="margin:0 0 8px">${t("avg")}: ${a}</div>`:""}<ul id="hist">${S.cycles.map((c,i)=>({c,i})).slice(-5).reverse().map(({c,i})=>`<li><span>${c.s} → ${c.e||t("ongo")}</span><button data-a="hd" data-v="${i}" aria-label="×">×</button></li>`).join("")}</ul>
 <div class="row" style="margin-top:8px"><label for="past">${t("pastL")}</label><input type="date" id="past" max="${iso(td)}"><button data-a="pa">+</button></div></section>`;
 const st=S.cycles.map(c=>D(c.s)),ln=[];for(let i=1;i<st.length;i++)ln.push(gap(st[i-1],st[i]));
 const bars=ln.slice(-8);
 if(bars.length){const m=Math.max(...bars,30);h+=`<section><h2>${t("chT")}</h2><svg viewBox="0 0 ${bars.length*40} 90" style="width:100%">${bars.map((v,i)=>`<rect x="${i*40+6}" y="${70-v/m*60}" width="28" height="${v/m*60}" rx="5" fill="var(--acc)"/><text x="${i*40+20}" y="84" text-anchor="middle" font-size="11" fill="var(--ink)">${v}</text>`).join("")}</svg></section>`}
 return h}

function settings(){
 const th=["rose","blue","green","dark","auto"],tn=ls("th");
 return`<section><h2>${t("set")}</h2>
 <div class="row"><label for="lang">${t("lang")}</label><select id="lang" data-f="lang"><option value="am"${S.lang==="am"?" selected":""}>አማርኛ</option><option value="en"${S.lang==="en"?" selected":""}>English</option></select></div>
 <div class="row"><label for="theme">${t("theme")}</label><select id="theme" data-f="theme">${th.map((v,i)=>`<option value="${v}"${S.theme===v?" selected":""}>${tn[i]}</option>`).join("")}</select></div>
 <div class="row"><label for="madh">${t("madh")}</label><select id="madh" data-f="madh"><option value="shafi"${S.madh==="shafi"?" selected":""}>${t("mS")}</option><option value="hanafi"${S.madh==="hanafi"?" selected":""}>${t("mH")}</option></select></div>
 <div class="row"><label for="cl">${t("cl")}</label><input type="number" id="cl" data-f="cl" min="21" max="45" value="${S.cl}"></div>
 <div class="row"><label for="pl">${t("pl")}</label><input type="number" id="pl" data-f="pl" min="1" max="15" value="${S.pl}"></div>
 <div class="row"><span>${t("hij")}</span><button data-a="hij" data-v="-1">−</button><b>${S.hij>0?"+":""}${S.hij}</b><button data-a="hij" data-v="1">+</button></div>
 <div class="row"><span>${t("fs")}</span><button data-a="fs" data-v="-10">A−</button><button data-a="fs" data-v="10">A+</button></div>
 <div class="row"><label for="pin">${t("pin")}</label><input type="password" inputmode="numeric" id="pin" maxlength="8"><button data-a="pin">${t("save")}</button></div>
 <div class="row"><button data-a="exp">${t("exp")}</button><button data-a="imp">${t("imp")}</button><button data-a="clr">${t("clr")}</button><button data-a="sum">${copied?t("cpd"):t("sum")}</button><button data-a="csv">${t("csv")}</button><input type="file" id="imp" accept=".json" hidden></div>
 <p class="warn">${t("warn")}</p></section>
 <section><details><summary>${t("gT")}</summary><p><b>${t("gh1")}</b></p><ol>${ls("gs").map(x=>`<li>${x}</li>`).join("")}</ol><p>${t("gr1")}</p></details></section>`}

/* ---- single render ---- */
function render(){
 const s=getStatus(),tabs=["home","ibada","health","cal","set"],ic=["🏠","🕌","❤️","📅","⚙️"],tn=ls("tabs");
 if(!tabs.includes(S.tab))S.tab="home";
 document.documentElement.lang=S.lang;document.documentElement.style.fontSize=(S.fs||100)+"%";
 document.documentElement.dataset.theme=S.theme==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"rose"):S.theme;
 const lk=$("lock");lk.hidden=!locked;
 if(locked&&!lk.innerHTML)lk.innerHTML=`<b>${t("unl")}</b><input id="lp" type="password" inputmode="numeric" autocomplete="off"><button class="main" data-a="ul">OK</button>`;
 const body={home,ibada,health,cal:calendar,set:settings}[S.tab](s);
 $("m").innerHTML=`<header><h1>${t("ttl")}<small>${t("sub")}</small></h1></header>${body}`;
 $("nav").innerHTML=tabs.map((id,i)=>`<button role="tab" data-a="tab" data-v="${id}" aria-selected="${S.tab===id}"><span style="font-size:1.3rem">${ic[i]}</span>${tn[i]}</button>`).join("")}

document.onclick=async e=>{
 const b=e.target.closest("[data-a]");if(!b)return;
 const a=b.dataset.a,v=b.dataset.v,td=today(),k=iso(td);
 if(a==="loc"){navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{S.loc={lat:p.coords.latitude,lng:p.coords.longitude};save();render()});return}
 if(a==="ul"){const p=S.pin;try{if(p&&await hp($("lp").value,p.s)===p.h){locked=false;$("lock").innerHTML=""}else $("lp").value=""}catch(x){}render();return}
 if(a==="pin"){const val=$("pin").value.trim();
  if(!val)S.pin=null;else try{const salt=crypto.getRandomValues(new Uint32Array(2)).join("-");S.pin={s:salt,h:await hp(val,salt)}}catch(x){}
  save();render();return}
 if(a==="imp"){$("imp").click();return}
 if(a==="clr"){if(confirm(t("sure"))){try{localStorage.removeItem(KEY)}catch(x){}location.reload()}return}
 if(a==="exp"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));l.download="sakina-backup.json";l.click();S.lb=k}
 else if(a==="sum"){const lines=[t("ttl"),`${t("avg")}: ${avg()||S.cl}`,...S.cycles.slice(-6).map(c=>`${c.s} → ${c.e||"…"}`)];
  try{await navigator.clipboard.writeText(lines.join("\n"));copied=true;setTimeout(()=>{copied=false;render()},2000)}catch(x){}}
 else if(a==="tab"){S.tab=v;scrollTo(0,0)}
 else if(a==="bs")S.cycles.push({s:k,e:null});
 else if(a==="be"){const l=S.cycles[S.cycles.length-1];if(l&&!l.e)l.e=k}
 else if(a==="hd")S.cycles.splice(+v,1);
 else if(a==="pa"){const val=$("past").value,s=val&&D(val);
  if(s&&s<=td){const e=add(s,(+S.pl||6)-1);S.cycles.push({s:val,e:e<td?iso(e):null});S.cycles.sort((x,y)=>x.s<y.s?-1:1);
   S.cycles.forEach((c,i)=>{const n=S.cycles[i+1];if(n&&(!c.e||c.e>=n.s))c.e=iso(add(D(n.s),-1))})}}
 else if(a==="sy"){const x=S.logs[k]||[];S.logs[k]=x.includes(+v)?x.filter(i=>i!==+v):[...x,+v]}
 else if(a==="pr"){const r=dy(k);r.pr[v]=r.pr[v]?0:1}
 else if(a==="fl"){const r=dy(k);r.fl=r.fl===+v?-1:+v}
 else if(a==="qa")S.qa++;
 else if(a==="qd")S.qa=Math.max(0,S.qa-1);
 else if(a==="qc"){S.qa+=+v;S.qc=S.cycles.filter(c=>c.e).map(c=>c.s)}
 else if(a==="fa"){const p=S.fa[k];if(p==="m")S.qa=Math.max(0,S.qa-1);if(p===v)delete S.fa[k];else{S.fa[k]=v;if(v==="m")S.qa++}}
 else if(a==="gh")S.gh=S.cycles[S.cycles.length-1].s;
 else if(a==="ni0")S.ni={s:k,e:null};else if(a==="ni1")S.ni.e=k;else if(a==="nid")S.ni=null;

 else if(a==="tb")dy(k).ad++;else if(a==="tbr")dy(k).ad=0;
 else if(a==="w"){const r=dy(k);r.w=Math.max(0,r.w+ +v)}
 else if(a==="md"){const r=dy(k);r.m=r.m===+v?-1:+v}
 else if(a==="csv"){const ks=[...new Set([...Object.keys(S.day),...Object.keys(S.logs)])].sort(),sy=L.syms[1].split("|");
  const rows=["date,mood,sleep,water,flow,prayers,symptoms",...ks.map(d=>{const b=S.day[d]||{};return[d,b.m,b.sl,b.w,b.fl,(b.pr||[]).join(""),(S.logs[d]||[]).map(i=>sy[i]).join("|")].map(z=>z===undefined?"":z).join(",")})];
  const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/csv"}));l.download="sakina-data.csv";l.click()}
 else if(a==="cm")cm+=+v;
 else if(a==="hij")S.hij=Math.max(-2,Math.min(2,S.hij+ +v));
 else if(a==="fs")S.fs=Math.min(140,Math.max(80,(S.fs||100)+ +v));
 save();render()};
document.onchange=e=>{const el=e.target;
 if(el.id==="imp"){const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(Array.isArray(o.cycles)){delete o.pin;Object.assign(S,o);save();render()}}catch(x){}};r.readAsText(f);return}
 const f=el.dataset.f;if(!f)return;
 if(f==="cl"){S.cl=Math.min(45,Math.max(21,+el.value||28));if(S.pl>S.cl-16)S.pl=Math.max(1,S.cl-16)}
 else if(f==="pl")S.pl=Math.min(15,Math.max(1,Math.min(+el.value||6,S.cl-16)));
 else if(f==="sl")dy(iso(today())).sl=el.value;
 else S[f]=el.value;
 save();render()};
render();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
